# Render Blueprint. One free web service. Mongo = Atlas. Gemma = Gemini API or a hosted Ollama endpoint.
# Missing optional hosts/keys: labelled fallbacks (keyword router, in-process workflows, moving-average forecast).
services:
  - type: web
    name: nivara
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: nivara
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemma-4-31b-it
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: gemma3:4b
      - key: FORECAST_MODE
        value: fallback
      - key: SERPAPI_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_API_KEY
        sync: false

  # Enable together with Temporal Cloud credentials above:
  # - type: worker
  #   name: nivara-worker
  #   runtime: node
  #   buildCommand: npm ci
  #   startCommand: npm run worker
  #   envVars: copy the web service's envVars (MONGODB_URI, LLM_*, OLLAMA_*, TEMPORAL_*, partner keys)
